<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasty Bites Restaurant</title>
</head>
<body style="margin: 0; padding: 0;">

  <!-- 1. Restaurant Header -->
  <div style="background-color: #8B0000; text-align: center; padding: 15px;">
    <h1 style="color: white; margin: 0; padding: 0;">Tasty Bites Restaurant</h1>
    <p style="color: rgb(240, 220, 220); margin: 5px 0 0 0; padding: 0;">Good Food Makes a Better Mood</p>
  </div>

  <!-- 2. Special Dishes -->
  <div style="background-color: #FFF8E1; padding: 15px;">
    <h2 style="color: darkorange; text-align: center; margin: 0 0 12px 0;">Our Special Dishes</h2>

    <table style="margin: 0 auto; border-collapse: collapse; width: 100%;">
      <tr style="background-color: orange;">
        <th style="color: white; border: 1px solid #cccccc; padding: 8px;">Dish Name</th>
        <th style="color: white; border: 1px solid #cccccc; padding: 8px;">Type</th>
        <th style="color: white; border: 1px solid #cccccc; padding: 8px;">Price</th>
      </tr>
      <tr style="background-color: rgb(255, 250, 240);">
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">Margherita Pizza</td>
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">Veg</td>
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">₹249</td>
      </tr>
      <tr style="background-color: rgb(255, 245, 230);">
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">Paneer Butter Masala</td>
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">Veg</td>
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">₹279</td>
      </tr>
      <tr style="background-color: rgb(255, 250, 240);">
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">Chicken Biryani</td>
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">Non-Veg</td>
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">₹299</td>
      </tr>
      <tr style="background-color: rgb(255, 245, 230);">
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">Chocolate Brownie</td>
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">Dessert</td>
        <td style="border: 1px solid #cccccc; padding: 8px; text-align: center;">₹149</td>
      </tr>
    </table>
  </div>

  <!-- 3. Promotional Message -->
  <div style="background-color: #FCE4EC; text-align: center; padding: 15px;">
    <p style="color: #8B0000; margin: 0; font-weight: bold;">Visit Us &amp; Enjoy Delicious Food!</p>
  </div>

  <!-- 4. Footer -->
  <div style="background-color: #2E1A1A; padding: 10px 15px;">
    <p style="color: white; text-align: left; margin: 0;">Open Daily: 11 AM &ndash; 11 PM</p>
    <p style="color: rgb(255, 224, 178); text-align: right; margin: 0;">Thank You!</p>
  </div>

</body>
</html>
